AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  [方式B / アカウントA] アカウントB のロールを AssumeRole し、
  得た一時認証情報で SigV4 署名して HTTP API を呼び出す。

Parameters:
  AccountBId:
    Type: String
    AllowedPattern: '^[0-9]{12}$'
    Description: API 提供側（アカウントB）の AWS アカウント ID

  ApiEndpoint:
    Type: String
    Default: ""
    Description: >
      B スタックの出力 ApiEndpoint。
      1 回目のデプロイ時点では B が未作成なので空でよい（3 ステップ目で設定する）。

  AssumeRoleArn:
    Type: String
    Default: ""
    Description: >
      B スタックの出力 ApiCallerRoleArn。
      空の場合はアカウントB配下の全ロールを対象にした暫定権限になる。
      3 ステップ目で実際のロール ARN に絞り込む。

  ExternalId:
    Type: String
    Default: ""
    Description: B 側と同じ値を設定する。使わないなら空のまま。

Conditions:
  HasAssumeRoleArn: !Not [!Equals [!Ref AssumeRoleArn, ""]]

Resources:
  CallerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-caller"
      CodeUri: src/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          API_ENDPOINT: !Ref ApiEndpoint
          API_REGION: !Ref AWS::Region
          ASSUME_ROLE_ARN: !Ref AssumeRoleArn
          EXTERNAL_ID: !Ref ExternalId
      # -----------------------------------------------------------
      # A 側に必要な権限は sts:AssumeRole の 1 つだけ。
      # execute-api:Invoke は【B 側のロール】が持っている。
      # 方式A と違い、A 側に API の権限を書く必要はない。
      # -----------------------------------------------------------
      Policies:
        - Statement:
            - Sid: AssumeCrossAccountRole
              Effect: Allow
              Action: sts:AssumeRole
              Resource: !If
                - HasAssumeRoleArn
                - !Ref AssumeRoleArn
                - !Sub "arn:${AWS::Partition}:iam::${AccountBId}:role/*"

Outputs:
  CallerRoleArn:
    Description: B スタックの CallerRoleArn パラメータに渡す ARN
    Value: !GetAtt CallerFunctionRole.Arn
  CallerFunctionName:
    Description: 動作確認で invoke する Lambda 関数名
    Value: !Ref CallerFunction
